    <style>
        * {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }

        html {
            scroll-behavior: smooth;
            scroll-padding-top: 100px;
        }

        .organic-shape {
            border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
            transition: border-radius 1.2s cubic-bezier(0.4, 0, 0.2, 1);
            will-change: border-radius, transform;
            transform: translateZ(0);
        }
        
        .organic-shape:hover {
            border-radius: 40% 60% 70% 30% / 30% 70% 40% 60%;
        }

        .glass-header {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            transform: translateZ(0);
            will-change: transform, background-color;
        }

        .premium-card {
            background: #ffffff;
            border: 1px solid rgba(208, 187, 149, 0.1);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            will-change: transform, box-shadow, border-color;
            transform: translateZ(0);
        }

        .premium-card:hover {
            border-color: rgba(208, 187, 149, 0.4);
            transform: translateY(-8px) translateZ(0);
            box-shadow: 0 30px 60px -20px rgba(208, 187, 149, 0.15);
        }

        .animate-fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }

        @media (min-width: 1024px) {
            ::-webkit-scrollbar {
                width: 8px;
            }
            ::-webkit-scrollbar-track {
                background: #FBF9F7;
            }
            ::-webkit-scrollbar-thumb {
                background: #D0BB95;
                border-radius: 10px;
                border: 2px solid #FBF9F7;
            }
            ::-webkit-scrollbar-thumb:hover {
                background: #C9A86A;
            }
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(208, 187, 149, 0.3);
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(208, 187, 149, 0.5);
        }

        .delay-100 { animation-delay: 100ms; }
        .delay-200 { animation-delay: 200ms; }
        .delay-300 { animation-delay: 300ms; }
        .delay-400 { animation-delay: 400ms; }

        @media (max-width: 640px) {
            input, select, textarea {
                font-size: 16px !important;
            }
        }

        section {
            content-visibility: auto;
            contain-intrinsic-size: 1px 500px;
        }
        .safe-area-bottom {
            padding-bottom: calc(1.5rem + env(safe-area-inset-bottom, 0px));
        }

        @media (max-width: 768px) {
            .assessment-focused-modal {
                height: 100%;
                height: -webkit-fill-available;
                width: 100%;
                position: fixed;
                top: 0;
                left: 0;
                border-radius: 0;
            }
        }
