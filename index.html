<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <!-- Favicon (self-hosted — was a Google Drive link, a link-rot risk) -->
    <link rel="icon" type="image/png" href="/icons/favicon.png">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">

    <!-- ── PWA + native-app feel ─────────────────────────────────────────── -->
    <!-- Manifest enables Add-to-Home-Screen on Android & desktop -->
    <link rel="manifest" href="/manifest.json">
    <!-- Theme colour for browser chrome (Android, PWA window) -->
    <meta name="theme-color" content="#1C1917" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1C1917" media="(prefers-color-scheme: dark)">

    <!-- iOS: launch as a full-screen standalone app from the home screen.
         No browser chrome, no URL bar — it looks native. -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Novogenics">
    <meta name="application-name" content="Novogenics">

    <!-- Primary Meta Tags -->
    <title>Novogenics | Regenerative Hair Restoration</title>
    <meta name="title" content="Novogenics | Regenerative Hair Restoration">
    <meta name="description" content="Specialist doctor-led clinic in Cheadle offering evidence-based regenerative hair loss treatments, including PRP and Autologous Exosome therapy.">
    <meta name="keywords" content="hair loss, PRP Manchester, Exosome therapy hair, hair thinning, regenerative medicine, hair restoration Cheadle, Dr Aminah Amer">
    <meta name="author" content="Dr Aminah Amer">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://novogenics.co.uk/">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://novogenics.co.uk/">
    <meta property="og:title" content="Novogenics | Regenerative Hair Restoration">
    <meta property="og:description" content="Evidence-based hair restoration. Private doctor-led clinic in Cheadle specialising in PRP and Exosomes.">
    <meta property="og:image" content="https://novogenics.co.uk/icons/icon-512.png">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://novogenics.co.uk/">
    <meta property="twitter:title" content="Novogenics | Regenerative Hair Restoration">
    <meta property="twitter:description" content="Evidence-based hair restoration. Private doctor-led clinic in Cheadle specialising in PRP and Exosomes.">
    <meta property="twitter:image" content="https://novogenics.co.uk/icons/icon-512.png">

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "MedicalBusiness",
      "name": "Novogenics",
      "alternateName": "Novogenics Hair Restoration",
      "description": "A specialist doctor-led clinic dedicated to hair restoration science, offering PRP, Exosomes, and Microneedling.",
      "url": "https://novogenics.co.uk",
      "logo": "https://novogenics.co.uk/images/logo-mark.png",
      "image": "https://novogenics.co.uk/images/dr-aminah.jpg",
      "founder": {
        "@type": "Person",
        "name": "Dr Aminah Amer"
      },
      "telephone": "+447356255598",
      "openingHoursSpecification": [
        {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
          "opens": "09:00",
          "closes": "18:00"
        },
        {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": "Saturday",
          "opens": "10:00",
          "closes": "16:00"
        }
      ],
      "medicalSpecialty": "Dermatology",
      "priceRange": "££"
    }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <!-- Material Symbols Outlined — full font, non-blocking. Icons are referenced
         dynamically across the app (e.g. male/female, calendar_month, space_dashboard),
         so loading the full set is more reliable than maintaining a subset list. -->
    <link rel="preload" as="style"
          href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=block"
          onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=block" rel="stylesheet"></noscript>
    <!-- Google Fonts: Inter (UI), Playfair Display (brand), JetBrains Mono — non-blocking -->
    <link rel="preload" as="style"
          href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=JetBrains+Mono:wght@400;500&display=swap"
          onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"></noscript>
    <!-- Inline critical CSS — body font + icon font class -->
    <style>
      body { font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; }
      .material-symbols-outlined {
        font-family: 'Material Symbols Outlined', sans-serif;
        font-weight: normal;
        font-style: normal;
        font-size: 24px;
        line-height: 1;
        letter-spacing: normal;
        text-transform: none;
        display: inline-block;
        white-space: nowrap;
        word-wrap: normal;
        direction: ltr;
        -webkit-font-smoothing: antialiased;
        font-feature-settings: 'liga';
        -webkit-font-feature-settings: 'liga';
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
    </style>
</head>
<body class="bg-ivory text-text-main antialiased overflow-x-hidden selection:bg-primary/30">
    <div id="root"></div>
    <script type="module" src="./index.tsx" defer></script>
</body>
</html>
