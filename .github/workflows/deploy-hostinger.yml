name: Deploy to Hostinger

# Builds the site and publishes it to novogenics.co.uk (Hostinger public_html)
# automatically on every push to main. Also runnable on demand from the
# Actions tab (Run workflow).
#
# ── One-time setup ────────────────────────────────────────────────────────────
# Add three repository secrets (GitHub → Settings → Secrets and variables →
# Actions → New repository secret):
#   HOSTINGER_FTP_HOST      e.g. ftp.novogenics.co.uk  (or the IP/host from hPanel → FTP Accounts)
#   HOSTINGER_FTP_USERNAME  the FTP account username
#   HOSTINGER_FTP_PASSWORD  the FTP account password
# Until all three are set, the build runs but the upload step is skipped
# (no failed runs). Once set, pushes deploy automatically.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: hostinger-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_HOST: ${{ secrets.HOSTINGER_FTP_HOST }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish to Hostinger (FTP)
        # Skips cleanly until the FTP secrets are configured.
        if: ${{ env.FTP_HOST != '' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_HOST }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          # Web root for the MAIN Hostinger FTP account. If you use a dedicated
          # FTP account already scoped to public_html, change this to ./
          server-dir: /public_html/
