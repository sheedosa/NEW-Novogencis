name: Deploy to GitHub Pages

# Builds the site and publishes it to novogenics.co.uk via GitHub Pages on
# every push to main. Also runnable on demand from the Actions tab.
#
# ── One-time setup ────────────────────────────────────────────────────────────
# 1. GitHub → Settings → Pages → Build and deployment → Source: "GitHub Actions"
# 2. GitHub → Settings → Pages → Custom domain: novogenics.co.uk
#    (public/CNAME already ships the domain with every build, so this box
#    should populate itself after the first successful deploy)
# 3. Tick "Enforce HTTPS" once GitHub finishes issuing the TLS certificate.
#
# No secrets are required: the Firebase client config is committed in
# firebase-applet-config.json, which is correct for a browser bundle.
#
# Note: a private repository needs GitHub Pro / Team for Pages to publish.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# GITHUB_TOKEN permissions required by the Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; let a newer push supersede a queued one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
